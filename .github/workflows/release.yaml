name: Release CI

on:
  push:
    tags:
      - v*.**
  workflow_dispatch: {}

env:
  IMAGE: ${{ github.actor }}/httest
  REGISTRY: ghcr.io
  BUILD_IMAGE: httest-builder

jobs:
  release-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for cross-compilation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross
          load: true
          tags: ${{ env.BUILD_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Make release builds
        env:
          VMODULES: /tmp/vmodules
          VCACHE: /tmp/vcache
          VERSION: ${{ github.ref_name }}
          DOCKER_IMAGE: ${{ env.BUILD_IMAGE }}
        run: |
          v install https://github.com/gechandesu/releasekit
          v release.vsh

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'httest_*'
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
