name: Release CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

env:
  IMAGE: ${{ github.actor }}/httest
  REGISTRY: ghcr.io
  BUILD_IMAGE: httest-builder

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for cross-compilation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cross
          load: true
          tags: ${{ env.BUILD_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Make release builds
        env:
          VMODULES: /tmp/vmodules
          VCACHE: /tmp/vcache
          VERSION: ${{ github.ref_name }}
          DOCKER_USER: '1001:1001'
          DOCKER_IMAGE: ${{ env.BUILD_IMAGE }}
        run: |
          v install https://github.com/gechandesu/releasekit
          v release.vsh
          pwd
          ls -alFh .

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            httest_*_linux_*
            !*.sha256

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'httest_*'
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false

  build-docker-images:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: .

      - name: Prepare binaries
        run: |
          for binary in httest_*_linux_*; do
            arch="${binary##*_linux_}"
            case "$arch" in
              arm32) platform='linux/arm/v7' ;;
              *)     platform="linux/$arch" ;;
            esac
            install -D -m 0755 -v "$binary" "dist/$platform/httest"
          done
          find dist -type f -exec ls -alFh {} +

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
            linux/riscv64
          context: .
          file: Dockerfile.release
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
